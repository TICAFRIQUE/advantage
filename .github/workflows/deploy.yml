name: Déploiement

# Push sur main (ou bouton « Run workflow ») : tests, puis build complet
# (vendor sans dev + CSS/JS) envoyé en rsync sur le serveur. Le .env, storage/
# et public/uploads/ du serveur ne sont jamais touchés. Voir docs/production.md § 9.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Jamais deux déploiements en même temps, jamais d'interruption en cours.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: advantage_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Base advantage_test et SMS simulés : fixés par phpunit.xml.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip, curl, intl, fileinfo
          coverage: none

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Vérifier le style (Pint)
        run: vendor/bin/pint --test

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Exécuter les tests
        run: php artisan test --compact

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: PRODUCTION
    if: github.ref == 'refs/heads/main'
    env:
      SERVEUR: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      DOSSIER: ${{ secrets.SERVER_PATH }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      # PHP 8.3 en ligne de commande sur le serveur (ex. /opt/cpanel/ea-php83/root/usr/bin/php).
      PHP: ${{ vars.PHP_BIN || 'php' }}
    steps:
      # ── 1. Récupérer le code ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. PHP + Composer (dépendances de production uniquement) ─────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath, intl, gd
          coverage: none

      - name: Installer les dépendances Composer (prod only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      # ── 3. Node + Vite (public/build, non versionné) ─────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances JS
        run: npm ci

      - name: Construire les assets (Vite)
        run: npm run build

      # ── 4. Connexion SSH ─────────────────────────────────────────────
      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -p "$SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Serveur injoignable sur $SERVER_HOST:$SSH_PORT (adresse, port SSH, ou pare-feu de l'hébergeur qui bloque GitHub)."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host $SERVER_HOST
            Port $SSH_PORT
            ConnectTimeout 20
            BatchMode yes
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            KexAlgorithms +diffie-hellman-group-exchange-sha256
            ServerAliveInterval 30
          EOF

      # Échec : relance en mode détaillé pour afficher la cause exacte.
      - name: Tester la connexion SSH
        run: |
          if ! ssh "$SERVEUR" "echo 'Connexion SSH OK' && command -v $PHP && $PHP -v | head -n 1 && command -v rsync"; then
            echo "::error::Connexion SSH refusée ou rsync absent : voir le détail ci-dessous."
            ssh -v "$SERVEUR" true 2>&1 | grep -vE '^debug1: (Reading|Applying|identity file|Local version|compat_|kex: |Remote protocol|SSH2_MSG|expecting|rekey|channel|client_input|pledge|Sending env|Requesting|Entering|Exit status)' || true
            exit 1
          fi
          if ! ssh "$SERVEUR" "$PHP -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'"; then
            echo "::error::« $PHP » n'est pas PHP 8.3 ou plus sur le serveur. Créer la variable PHP_BIN (ex. /opt/cpanel/ea-php83/root/usr/bin/php) dans l'environnement PRODUCTION."
            exit 1
          fi

      # ── 5. Contrôle de sécurité puis mise en maintenance ─────────────
      # Configuration (.env) non conforme (code 1) : arrêt avant toute coupure.
      # Première installation, ou version en ligne qui plante (erreur fatale
      # PHP : code 255) : le déploiement continue, c'est lui qui la répare.
      - name: Mise en maintenance
        run: |
          ssh "$SERVEUR" "bash -s" <<EOF
            set -e
            cd '$DOSSIER'
            test -f .env || { echo "::error::.env absent dans $DOSSIER : le créer d'abord (docs/production.md § 2.2)."; exit 1; }
            if [ ! -f artisan ]; then
              echo "Première installation : aucun code en ligne."
              exit 0
            fi
            # Caches régénérés ensuite ; d'anciens caches (paquets de dev…) feraient planter artisan.
            find bootstrap/cache -maxdepth 1 -name '*.php' -delete 2>/dev/null || true
            code=0
            $PHP -d display_errors=stderr artisan securite:verifier || code=\$?
            if [ "\$code" -eq 1 ]; then
              echo "::error::Configuration de production non conforme (voir « À CORRIGER » ci-dessus) : site non touché."
              exit 1
            fi
            if [ "\$code" -ne 0 ]; then
              echo "::warning::La version en ligne plante (code \$code, erreur ci-dessus) : le déploiement la remplace."
            fi
            $PHP artisan down --retry=60 || echo "::warning::Mise en maintenance impossible sur la version en ligne."
          EOF

      # ── 6. Envoi des fichiers via rsync ──────────────────────────────
      # Les chemins exclus ne sont jamais supprimés par --delete.
      - name: Déployer via rsync
        run: |
          rsync -az --delete --stats \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/uploads/' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            --exclude='/.claude/' --exclude='/.agents/' --exclude='/.cursor/' --exclude='/.kilo/' \
            --exclude='/CLAUDE.md' --exclude='/AGENTS.md' --exclude='/boost.json' \
            --exclude='/*.pdf' \
            --exclude='/public/.well-known/' --exclude='/public/cgi-bin/' \
            --exclude='.user.ini' --exclude='php.ini' --exclude='error_log' \
            ./ "$SERVEUR:$DOSSIER/"

      # ── 7. Commandes post-déploiement ────────────────────────────────
      # Un échec laisse le site en maintenance : une base à moitié migrée
      # ne doit jamais servir (voir docs/production.md § 9).
      - name: Post-deploy (migrations, permissions, caches)
        run: |
          ssh "$SERVEUR" "bash -s" <<EOF
            set -e
            cd '$DOSSIER'
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs storage/app/sauvegardes bootstrap/cache public/uploads
            # Caches de l'ancienne version (paquets, config, routes) : supprimés avant
            # tout appel à artisan, qui planterait sur un paquet retiré de vendor/.
            find bootstrap/cache -maxdepth 1 -name '*.php' -delete
            # Migrations d'abord : cache:clear (dans optimize:clear) écrit dans la
            # table cache, absente d'une base neuve.
            $PHP artisan migrate --force
            $PHP artisan permissions:synchroniser
            $PHP artisan optimize:clear
            $PHP artisan optimize
            $PHP artisan queue:restart
            $PHP artisan securite:verifier
            $PHP artisan up
          EOF

      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/deploy_key
